<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cherry Grove</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Source+Sans+3:wght@400;600&display=swap">
<style>
  /* Layout: one full-bleed image with an SVG hotspot layer; a glass panel slides in from the right with the article. Single dark theme — the image sets the mood. */
  :root {
    --bg: #0b0a1a;
    --fg: #ece6f4;
    --muted: #a99fbf;
    --glow: #ffd27a;
    --glow-soft: rgba(255, 210, 122, 0.35);
    --panel: rgba(16, 13, 36, 0.82);
    --line: rgba(236, 230, 244, 0.14);
    --display: "Cormorant Garamond", "Georgia", serif;
    --body: "Source Sans 3", "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--body);
    overflow: hidden;
  }
  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    display: grid;
    place-items: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px;
    box-sizing: border-box;
  }
  .frame {
    position: relative;
    width: min(100%, calc((100vh - 24px) * 1.7914));
    aspect-ratio: 2576 / 1438;
    max-width: 100%;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.6);
  }
  .frame img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .frame svg { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* Hotspots */
  .spot {
    fill: rgba(255,255,255,0);
    stroke: rgba(255,210,122,0);
    stroke-width: 6;
    cursor: pointer;
    transition: fill .35s ease, stroke .35s ease, filter .35s ease;
    outline: none;
  }
  .spot:hover, .spot:focus-visible, .spot.active {
    fill: rgba(255,230,180,.14);
    stroke: var(--glow);
    filter: drop-shadow(0 0 14px var(--glow)) drop-shadow(0 0 40px var(--glow-soft));
    animation: breathe 2.2s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { filter: drop-shadow(0 0 10px var(--glow)) drop-shadow(0 0 30px var(--glow-soft)); }
    50%      { filter: drop-shadow(0 0 22px var(--glow)) drop-shadow(0 0 60px var(--glow-soft)); }
  }
  @media (prefers-reduced-motion: reduce) { .spot:hover, .spot.active { animation: none; } }

  /* Hover label */
  .tip {
    position: absolute;
    pointer-events: none;
    padding: 6px 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    font: 500 15px/1 var(--display);
    letter-spacing: .04em;
    color: var(--fg);
    transform: translate(-50%, -140%);
    opacity: 0;
    transition: opacity .2s;
    white-space: nowrap;
    backdrop-filter: blur(8px);
  }
  .tip.show { opacity: 1; }

  /* Article panel */
  .panel {
    position: fixed;
    top: env(safe-area-inset-top, 0px);
    right: 0;
    bottom: 0;
    width: min(440px, 100%);
    background: var(--panel);
    backdrop-filter: blur(18px);
    border-left: 1px solid var(--line);
    transform: translateX(104%);
    transition: transform .45s cubic-bezier(.2,.8,.2,1);
    padding-block: 28px;
    padding-left: 28px;
    padding-right: max(28px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
    overflow-y: auto;
    z-index: 5;
  }
  .panel.open { transform: translateX(0); }
  .panel .eyebrow {
    font: 600 11px/1 var(--body);
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--glow);
    margin: 0 0 12px;
  }
  .panel h2 {
    font: 600 34px/1.1 var(--display);
    margin: 0 0 18px;
    text-wrap: balance;
  }
  .panel p { font-size: 17px; line-height: 1.6; color: var(--fg); max-width: 60ch; margin: 0 0 14px; }
  .panel .close {
    position: absolute; top: 18px; right: max(18px, env(safe-area-inset-right, 0px));
    background: none; border: 1px solid var(--line); color: var(--fg);
    width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer;
  }
  .panel .close:hover, .panel .close:focus-visible { border-color: var(--glow); color: var(--glow); outline: none; }

  /* Hint */
  .hint {
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    font: 500 14px/1 var(--display); letter-spacing: .08em; color: var(--muted);
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
    padding: 8px 16px; pointer-events: none; opacity: .9;
  }

  /* Editor mode (open with #edit) */
  .editor {
    position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); bottom: 16px; z-index: 6;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; width: min(420px, calc(100% - 32px)); box-sizing: border-box;
    font-size: 13px; color: var(--muted);
  }
  .editor textarea { width: 100%; height: 70px; margin-top: 8px; background: #000; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; font: 12px/1.4 monospace; box-sizing: border-box; }
  .editor b { color: var(--glow); }
  .edit-dot { fill: var(--glow); }
  .edit-poly { fill: rgba(255,210,122,.2); stroke: var(--glow); stroke-width: 3; }
</style>
</head>
<body>

<div class="stage">
  <div class="frame" id="frame">
    <img src="cherries.jpg" alt="Two giant glossy cherries joined by a stem, standing in a glowing psychedelic forest at twilight." id="img">
    <svg viewBox="0 0 2576 1438" preserveAspectRatio="none" id="map" aria-label="Clickable regions of the image">
      <ellipse class="spot" data-id="left" tabindex="0" role="button" aria-label="The left cherry"
        cx="1037" cy="989" rx="296" ry="286"/>
      <ellipse class="spot" data-id="right" tabindex="0" role="button" aria-label="The right cherry"
        cx="1604" cy="953" rx="283" ry="277"/>
    </svg>
    <div class="tip" id="tip"></div>
    <div class="hint" id="hint">Hover a cherry · click to read</div>
  </div>
</div>

<aside class="panel" id="panel" aria-live="polite">
  <button class="close" id="close" aria-label="Close article">×</button>
  <p class="eyebrow" id="p-eyebrow"></p>
  <h2 id="p-title"></h2>
  <div id="p-body"></div>
</aside>

<script>
  // ---- Articles: one entry per region. Replace the text with your own. ----
  const ARTICLES = {
    left: {
      eyebrow: "Gergő"
      title: "Az éberen őrködő",
      body: [
        "Szöveg 1",
        "Write your own text here, or point this entry at a Markdown file later. Each region of the picture can carry a different story."
      ]
    },
    right: {
      eyebrow: "Theodóri",
      title: "Az égi szövetséges",
      body: [
        "Szöveg 2",
        "Two cherries on one stem is the oldest picture of a pair there is: joined at the top, separate at the bottom."
      ]
    },
  };

  const frame = document.getElementById('frame');
  const map = document.getElementById('map');
  const tip = document.getElementById('tip');
  const panel = document.getElementById('panel');
  const hint = document.getElementById('hint');
  let active = null;

  function openArticle(id, el) {
    const a = ARTICLES[id];
    if (!a) return;
    document.getElementById('p-eyebrow').textContent = a.eyebrow;
    document.getElementById('p-title').textContent = a.title;
    document.getElementById('p-body').innerHTML = a.body.map(p => `<p>${p}</p>`).join('');
    panel.classList.add('open');
    map.querySelectorAll('.spot.active').forEach(s => s.classList.remove('active'));
    map.querySelectorAll(`.spot[data-id="${id}"]`).forEach(s => s.classList.add('active'));
    active = id;
    hint.hidden = true;
  }
  function closeArticle() {
    panel.classList.remove('open');
    map.querySelectorAll('.spot.active').forEach(s => s.classList.remove('active'));
    active = null;
  }

  map.querySelectorAll('.spot').forEach(spot => {
    spot.addEventListener('click', () => openArticle(spot.dataset.id, spot));
    spot.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openArticle(spot.dataset.id, spot); } });
    spot.addEventListener('mouseenter', () => { tip.textContent = spot.getAttribute('aria-label'); tip.classList.add('show'); });
    spot.addEventListener('mousemove', e => {
      const r = frame.getBoundingClientRect();
      tip.style.left = (e.clientX - r.left) + 'px';
      tip.style.top = (e.clientY - r.top) + 'px';
    });
    spot.addEventListener('mouseleave', () => tip.classList.remove('show'));
  });
  document.getElementById('close').addEventListener('click', closeArticle);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeArticle(); });

  // ---- Editor mode: open the page with #edit, click around a region, double-click to finish. ----
  if (location.hash === '#edit') {
    const box = document.createElement('div');
    box.className = 'editor';
    box.innerHTML = '<b>Editor</b> — click around the edge of a region. Double-click to finish. Copy the points below into a new &lt;polygon&gt;.<textarea id="out" readonly></textarea>';
    document.body.appendChild(box);
    const out = box.querySelector('#out');
    let pts = [];
    const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    poly.setAttribute('class', 'edit-poly');
    map.appendChild(poly);
    const toImg = e => {
      const r = frame.getBoundingClientRect();
      return [Math.round((e.clientX - r.left) / r.width * 2576), Math.round((e.clientY - r.top) / r.height * 1438)];
    };
    map.style.pointerEvents = 'none';
    frame.addEventListener('click', e => {
      pts.push(toImg(e));
      poly.setAttribute('points', pts.map(p => p.join(',')).join(' '));
      out.value = `points="${pts.map(p => p.join(',')).join(' ')}"`;
    });
    frame.addEventListener('dblclick', () => { pts = []; });
    hint.textContent = 'Editor mode';
  }
</script>
</body>
</html>
